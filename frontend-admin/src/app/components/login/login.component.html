<p-toast></p-toast>
<div class="container">
    <div class="container-body">
        <div class="card-login">
            <form [formGroup]="loginForm" (ngSubmit)="login()">
                <div class="header">
                    <h3>Login to Admin</h3>
                </div>
                <div class="form-group mb-3">
                    <p>Username</p>
                    <input id="username" type="text" formControlName="username" class="form-control p-inputtext" placeholder="Enter your username" />
                    <div *ngIf="loginForm.get('username').touched && loginForm.get('username').hasError('required')" class="error-message">
                        Username is required.
                    </div>
                </div>
                <div class="form-group mb-3">
                    <p>Password</p>
                    <input id="password" type="password" formControlName="password" class="form-control p-inputtext" placeholder="Enter your password" />
                    <div *ngIf="loginForm.get('password').touched && loginForm.get('password').hasError('required')" class="error-message">
                        Password is required.
                    </div>
                    <div *ngIf="loginForm.get('password').touched && loginForm.get('password').hasError('minlength')" class="error-message">
                        Password must be at least 6 characters long.
                    </div>
                </div>
                <button type="submit" class="btn p-button p-component">Login</button>
                <div *ngIf="msg" class="error-message">{{ msg }}</div>
            </form>
        </div>
        <div class="image">
            <img src="https://i.pinimg.com/564x/01/a8/b2/01a8b20022d3ac8d1c0ad960e7b67466.jpg" alt="Cooking">
        </div>
    </div>
</div>
