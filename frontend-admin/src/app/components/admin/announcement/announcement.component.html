<div class="button-container" >
    <button pButton type="button" label="Add" [routerLink]="['/admin/addAnnouncement']" class="custom-button"></button>
    <button pButton type="button" (click)="reloadPage()" class="custom-button-reload">Reload</button>
    
    <input type="date" id="selectedDate" (change)="onDateChange($event)" class="search-input" style="width: 300px;">
</div>



<div class="card">
    <p-table [value]="announcements" [paginator]="true" [rows]="5" [tableStyle]="{ 'min-width': '50rem' }"
        [rowsPerPageOptions]="[1,2,3]" class="custom-table">
        <ng-template pTemplate="header">
            <tr>
                <th>Id</th>
                <th>content</th>         
                <th>createdAt</th>
                <th>Action</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-announcement>
            <tr>
                <td>{{announcement.announcementId}}</td>
                <td>
                    {{announcement.content}}
                </td>
                <td>{{announcement.createdAt}}</td>
                <td>
                    <button pButton type="button" label="Delete" icon="pi pi-trash" class="p-button-danger"
                        (click)="confirmDelete(announcement.announcementId)"></button>
                        &nbsp;
                        <button pButton type="button" label="Update"  class="p-button-success"
                        (click)="showDialog(announcement)"></button>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="summary">
            <div class="flex align-items-center justify-content-between">
                <!-- Add any summary content here if needed -->
            </div>
        </ng-template>
    </p-table>
</div>
<p-dialog header="Update" [(visible)]="visible" [modal]="true" [style]="{ width: '50rem' }">
    @if(updateForm != null){
        <form [formGroup]="updateForm" (ngSubmit)="save()">
            <div class="row">
                <div class="col-sm-6">
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" formControlName="content" class="form-control" placeholder="Enter title...">
                    </div>
                </div>
            </div>
            <button type="submit" class="btn btn-success">Submit</button>
        </form>
    }
        
</p-dialog>
