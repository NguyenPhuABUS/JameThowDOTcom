<div class="card">
    <!-- Search Input -->
    <div class="p-inputgroup">
        <span class="p-inputgroup-addon"><i class="pi pi-search"></i></span>
        <input type="text" pInputText placeholder="Search" (input)="onGlobalFilter($event)">
    </div>

    <p-table #dt2 [value]="payments" [paginator]="true" [rows]="5" [tableStyle]="{ 'min-width': '50rem' }"
        [rowsPerPageOptions]="[5, 10, 15]" [globalFilterFields]="['username','typep','startDate','endDate','status','paymentDate','paymentMethod']" class="custom-table">
        <ng-template pTemplate="header">
            <tr>
                <th>#</th>
                <th>Username</th>
                <th>Typep</th>
                <th>Amount</th>
                <th>StartDate</th>
                <th>EndDate</th>
                <th>Status</th>
                <th>PaymentDate</th>
                <th>PaymentMethod</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-payment let-i="rowIndex">
            <tr>
                <td>{{i + 1}}</td>
                <td>{{payment.username}}</td>
                <td>{{payment.typep}}</td>
                <td>{{payment.amount}}$</td>
                <td>{{payment.startDate}}</td>
                <td>{{payment.endDate}}</td>
                <td>{{payment.status}}</td>
                <td>{{payment.paymentDate}}</td>
                <td>{{payment.paymentMethod}}</td>
            </tr>
        </ng-template>
    </p-table>
</div>
