<div class="button-container">
    <button pButton type="button" (click)="reloadPage()" class="custom-button-reload" >
        Reload
    </button>
    <button pButton type="button" label="Add"class="p-button-success2" style="margin-left: 20px;border-radius: 10px;" 
    (click)="showDialog2()"></button>
</div>
<div class="card">
    
    <p-table [value]="categories" [paginator]="true" [rows]="5" [tableStyle]="{ 'min-width': '50rem' }"
        [rowsPerPageOptions]="[1,2,3]" class="custom-table">
        <ng-template pTemplate="header">
            <tr>
                <th>Id</th>
                <th>categoryname</th>         
                <th>Action</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-category>
            <tr>
                <td>{{category.categoryId}}</td>
                <td>
                    {{category.categoryName}}
                </td>
                <td>
                    <button pButton type="button" label="Delete" icon="pi pi-trash" class="p-button-danger"
                        (click)="confirmDelete(category.categoryId)"></button>
                        <button pButton type="button" label="Update"  class="p-button-success"
                        (click)="showDialog(category)"></button>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="summary">
            <div class="flex align-items-center justify-content-between">
            </div>
        </ng-template>
    </p-table>
</div>
<p-dialog header="Update" [(visible)]="visible" [modal]="true" [style]="{ width: '50rem' }">
    @if(updateForm != null){
        <form [formGroup]="updateForm" (ngSubmit)="save()">
            <div class="row">
                <div class="col-sm-6">
                    <div class="form-group">
                        <label>CategoryName</label>
                        <input type="text" formControlName="categoryName" class="form-control" placeholder="Enter title...">
                    </div>
                </div>
            </div>
            <button type="submit" class="btn btn-success">Submit</button>
        </form>
    }
        
</p-dialog>
<p-dialog header="Add" [(visible)]="visible2" [modal]="true" [style]="{ width: '50rem' }">
   @if(addForm != null){
    <form [formGroup]="addForm" (ngSubmit)="save2()">
        <div class="row">
            <div class="col-sm-6">
                <div class="form-group">
                    <label>CategoryName</label>
                    <input type="text"  class="form-control" formControlName="categoryName" placeholder="Enter title...">
                </div>
            </div>
        </div>
        <button type="submit" class="btn btn-success">Submit</button>
    </form>

   }
      
</p-dialog>
