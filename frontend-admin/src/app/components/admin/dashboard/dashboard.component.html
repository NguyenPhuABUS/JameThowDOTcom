<section class="content">
  <div class="container-fluid">
      <!-- Small boxes (Stat box) -->
      <div class="row">
          <div class="col-lg-3 col-6">
              <!-- small box -->
              <div class="small-box bg-info">
                  <div class="inner">
                      <h3>{{totalContent}}</h3>
                      <p>Content</p>
                  </div>
                  <div class="icon">
                      <i class="fas fa-file-alt"></i>
                  </div>
                  <a [routerLink]="'/admin/content'" class="small-box-footer">More info <i class="fas fa-arrow-circle-right"></i></a>
              </div>
          </div>
          <!-- ./col -->
          <div class="col-lg-3 col-6">
              <!-- small box -->
              <div class="small-box bg-success">
                  <div class="inner">
                      <h3>{{totalContest}}</h3>
                      <p>Contest</p>
                  </div>
                  <div class="icon">
                      <i class="fas fa-trophy"></i>
                  </div>
                  <a [routerLink]="'/admin/contest'" class="small-box-footer">More info <i class="fas fa-arrow-circle-right"></i></a>
              </div>
          </div>
          <!-- ./col -->
          <div class="col-lg-3 col-6">
              <!-- small box -->
              <div class="small-box bg-warning">
                  <div class="inner">
                      <h3>{{totalAccounts}}</h3>
                      <p>User</p>
                  </div>
                  <div class="icon">
                      <i class="fas fa-user"></i>
                  </div>
                  <!-- Thêm router link -->
                  <a [routerLink]="'/admin/account-info'" class="small-box-footer">More info <i class="fas fa-arrow-circle-right"></i></a>
              </div>
          </div>
          <!-- ./col -->
          <div class="col-lg-3 col-6">
              <!-- small box -->
              <div class="small-box bg-danger">
                  <div class="inner">
                      <h3>{{totalanouncements}}</h3>
                      <p>Announcement</p>
                  </div>
                  <div class="icon">
                      <i class="fas fa-bullhorn"></i>
                  </div>
                  <a [routerLink]="'/admin/announcement'" class="small-box-footer">More info <i class="fas fa-arrow-circle-right"></i></a>
              </div>
          </div>
          <!-- ./col -->
          <div class="col-lg-3 col-6">
              <!-- small box -->
              <div class="small-box bg-info">
                  <div class="inner">
                      <h3>{{totalcategories}}</h3>
                      <p>Category</p>
                  </div>
                  <div class="icon">
                      <i class="fas fa-list-alt"></i>
                  </div>
                  <a [routerLink]="'/admin/category'" class="small-box-footer">More info <i class="fas fa-arrow-circle-right"></i></a>
              </div>
          </div>
          <!-- ./col -->
          <div class="col-lg-3 col-6">
              <!-- small box -->
              <div class="small-box bg-success">
                  <div class="inner">
                      <h3>{{totalcontact}}</h3>
                      <p>Contact</p>
                  </div>
                  <div class="icon">
                      <i class="fas fa-envelope"></i>
                  </div>
                  <a [routerLink]="'/admin/contact'" class="small-box-footer">More info <i class="fas fa-arrow-circle-right"></i></a>
              </div>
          </div>
          <!-- ./col -->
          <div class="col-lg-3 col-6">
              <!-- small box -->
              <div class="small-box bg-primary">
                  <div class="inner">
                      <h3>{{totalpayment}}</h3>
                      <p>Payment</p>
                  </div>
                  <div class="icon">
                      <i class="fas fa-credit-card"></i>
                  </div>
                  <a [routerLink]="'/admin/payment'" class="small-box-footer">More info <i class="fas fa-arrow-circle-right"></i></a>
              </div>
          </div>
          <!-- ./col -->
      </div>
  </div>
</section>
