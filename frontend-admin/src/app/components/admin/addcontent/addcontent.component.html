
  <div class="container">
      <div class="card card-warning" style="border-radius: 10px;">
          <div class="card-header">
              <h3 class="card-title">Add Content</h3>
          </div>
          <div class="card-body">
              <form [formGroup]="addForm" (ngSubmit)="save()">
                  <div class="row">
                      <div class="col-sm-6">
                          <div class="form-group">
                              <label>Title</label>
                              <input type="text" formControlName="title" class="form-control" placeholder="Enter title...">
                          </div>
                          <div class="form-group">
                              <label>Content Type</label>
                              <select formControlName="contentType" class="form-control">
                                  <option value="recipe">Recipe</option>
                                  <option value="tip">Tip</option>
                              </select>
                          </div>
                          <div class="form-group">
                              <label>Content</label>
                              <input type="text" formControlName="content1" class="form-control" placeholder="Enter content...">
                          </div>
                          <div class="form-group">
                              <label>Image</label>
                              <div class="custom-file">
                                  <input type="file" (change)="selectFile($event)" id="file-upload">
                                  <label for="file-upload">Choose file</label>
                                  <br>
                                  <span class="file-name">{{ selectedFileName }}</span>
                              </div>
                          </div>
                      </div>
                      <div class="col-sm-6">
                          <div class="form-group">
                              <label>Is Free</label>
                              <div class="custom-checkbox">
                                  <input type="checkbox" formControlName="isFree">
                              </div>
                          </div>
                          <div class="form-group">
                              <label>Category Name</label>
                              <select formControlName="categoryId" class="form-control">
                                  <option *ngFor="let category of categories" [value]="category.categoryId">
                                      {{category.categoryName}}
                                  </option>
                              </select>
                          </div>
                      </div>
                  </div>
                  <button type="submit" class="btn btn-custom">Submit</button>
              </form>
          </div>
      </div>
  </div>
