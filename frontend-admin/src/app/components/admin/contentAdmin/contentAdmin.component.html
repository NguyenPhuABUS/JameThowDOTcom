<div class="button-container">
    <div class="search-container" style="flex: 1; margin-right: 10px;">
        <input type="text" pInputText placeholder="Search" (input)="onGlobalFilter($event)" style="width: 100%;">
    </div>
        <button pButton type="button" label="Add" (click)="showAddDialog()"
        class="custom-button"></button>
    <!-- <button pButton type="button" (click)="reloadPage()" class="custom-button-reload">
        Reload
    </button> -->
    <button pButton type="button" label="Back" [routerLink]="['/admin/content']"
        class="custom-button-back"></button>
</div>
<div class="card">
    <p-table #dt2 dataKey="id" [value]="contents" [paginator]="true" [rows]="5" [tableStyle]="{ 'min-width': '50rem' }"
        [rowsPerPageOptions]="[5, 10, 15]" [globalFilterFields]="['title','content1','username','categoryName','isFree']" class="custom-table">
        <ng-template pTemplate="header">
            <tr>
                <th>#</th>
                <th pSortableColumn="title">Title<p-sortIcon field="title"></p-sortIcon></th>
                <th>Image</th>
                <th style="width: 15%">Content</th>
                <th style="width: 17%">Username</th>
                <th pSortableColumn="categoryName" style="width:13%">Category<p-sortIcon field="categoryName"></p-sortIcon></th>
                <th>IsFree</th>
                <th pSortableColumn="rating">Rating<p-sortIcon field="rating"></p-sortIcon></th>
                <th>Action</th>
            </tr>
            <tr>
                <th></th>
                <th></th>
                <th></th>
                <th>
                    <p-columnFilter type="text" field="content1" placeholder="Content" ariaLabel="Filter Content"></p-columnFilter>
                </th>
                <th>
                    <p-columnFilter type="text" field="username" placeholder="Username" ariaLabel="Filter Username"></p-columnFilter>
                </th>
                <th>
                    <p-columnFilter field="categoryName" matchMode="equals" [showMenu]="false">
                        <ng-template pTemplate="filter" let-value let-filter="filterCallback">
                            <p-dropdown 
                                [(ngModel)]="selectedCategory" 
                                [options]="categoryOptions"
                                (onChange)="filter($event.value)" 
                                placeholder="Select One" 
                                [showClear]="true">
                            </p-dropdown>
                        </ng-template>
                    </p-columnFilter>
                </th>
                <th><p-columnFilter type="boolean" field="isFree" /></th>
                <th></th>
                <th></th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-content let-i="rowIndex">
            <tr>
                <td>{{i + 1}}</td>
                <td>{{content.title}}</td>
                <td><img src="{{content?.imageUrl}}" class="avatar" style="width: 50px; height: 50px;"></td>
                <!-- <td class="content-cell">{{content.content1}}</td> -->
                <td class="content-cell"><p [innerHTML]="content.content1 | formatContent | truncate:100"></p></td>
                <td>{{content.username}}</td>
                <td>{{content.categoryName}}</td>
                <td>{{content.isFree}}</td>
                <td><p-rating [(ngModel)]="content.rating" [cancel]="false" [readonly]="true"></p-rating></td>
                <td>
                    <button pButton type="button" icon="pi pi-trash" class="p-button-danger" (click)="confirmDelete(content.contentId)" style="margin-right: 5px;"></button>
                    <button pButton type="button" icon="pi pi-comments" class="p-button-success" (click)="showDialog(content)"></button>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
<p-dialog header="Update" [(visible)]="visible" [modal]="true" [style]="{ width: '50rem' }">
    @if(updateForm != null){
    <form [formGroup]="updateForm" (ngSubmit)="save()">
        <div class="row">
            <div class="col-sm-6">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" formControlName="title" class="form-control" placeholder="Enter title...">
                </div>
                <div class="form-group">
                    <label>Content Type</label>
                    <select formControlName="contentType" class="form-control">
                        <option value="recipe">Recipe</option>
                        <option value="tip">Tip</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Content</label>
                    <input type="text" formControlName="content1" class="form-control" placeholder="Enter content...">
                </div>
                <div class="form-group">
                    <label>Image</label>
                    <div class="custom-file">
                        <input type="file" (change)="selectFile($event)" id="file-upload">
                        <label for="file-upload">Choose file</label>
                        <br>
                        <span class="file-name">{{ selectedFileName }}</span>
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label>Is Free</label>
                    <div class="custom-checkbox">
                        <input type="checkbox" formControlName="isFree">
                    </div>
                </div>
                <div class="form-group">
                    <label>Category Name</label>
                    <select formControlName="categoryId" class="form-control">
                        @if(categories != null){
                        @for (category of categories; track category) {
                        <option value="{{category.categoryId}}">{{category.categoryName}}</option>
                        }
                        }
                    </select>
                </div>
            </div>
        </div>
        <button type="submit" class="btn btn-success">Submit</button>
    </form>
    }

</p-dialog>
<p-dialog header="Add" [(visible)]="dislogAdd" [modal]="true" [style]="{ width: '50rem' }">
    <form [formGroup]="addForm" (ngSubmit)="submit()">
        <div class="row">
            <div class="col-sm-6">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" formControlName="title" class="form-control" placeholder="Enter title...">
                </div>
                <div class="form-group">
                    <label>Content Type</label>
                    <select formControlName="contentType" class="form-control">
                        <option value="recipe">Recipe</option>
                        <option value="tip">Tip</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Content</label>
                    <input type="text" formControlName="content1" class="form-control" placeholder="Enter content...">
                </div>
                <div class="form-group">
                    <label>Image</label>
                    <div class="custom-file">
                        <input type="file" (change)="selectFile($event)" id="file-upload">
                        <label for="file-upload">Choose file</label>
                        <br>
                        <span class="file-name">{{ selectedFileName }}</span>
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label>Is Free</label>
                    <div class="custom-checkbox">
                        <input type="checkbox" formControlName="isFree">
                    </div>
                </div>
                <div class="form-group">
                    <label>Category Name</label>
                    <select formControlName="categoryId" class="form-control">
                        <option *ngFor="let category of categories" [value]="category.categoryId">
                            {{category.categoryName}}
                        </option>
                    </select>
                </div>
            </div>
        </div>
        <button type="submit" class="btn btn-custom">Submit</button>
    </form>
</p-dialog>
