<style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f7f7f7;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
  
    .bradcam_text {
      color: white;
    }
  
    .register-section {
      padding: 60px 0;
    }
  
    .register-container {
      background-color: #fff;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      border-radius: 5px;
      width: 300px;
      text-align: center;
    }
  
    h2 {
      margin-bottom: 20px;
    }
  
    form {
      display: flex;
      flex-direction: column;
    }
  
    label {
      margin-bottom: 5px;
      text-align: left;
    }
  
    input {
      margin-bottom: 15px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
  
    p {
      margin-top: 15px;
    }
  
    a {
      color: #007bff;
    }
  
    a:hover {
      text-decoration: underline;
    }
  
    .error-message {
      color: red;
      font-size: 0.9em;
      margin-top: -10px;
      margin-bottom: 10px;
    }
  </style>
  
  <!-- bradcam_area  -->
  <div class="bradcam_area bradcam_bg_1">
    <div class="container">
      <div class="row">
        <div class="col-xl-12">
          <div class="bradcam_text text-center">
            <h3>Reset Password</h3>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- /bradcam_area  -->
  
  <!-- ================ register section start ================= -->
  <section class="register-section section_padding">
    <div class="container">
      <div class="row">
        <div class="col-12">
          <h2 class="register-title">Enter your new password</h2>
        </div>
        <div class="col-lg-8">
          <form class="form-register register_form" [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()" id="resetPasswordForm" novalidate="novalidate">
            <div class="row">
              <div class="col-12">
                <div class="form-group">
                  <input class="form-control" formControlName="newPassword" name="newPassword" id="newPassword" type="password" placeholder="Enter your new password" required>
                  <div *ngIf="resetPasswordForm.get('newPassword').touched && resetPasswordForm.get('newPassword').invalid" class="error-message">
                    <div *ngIf="resetPasswordForm.get('newPassword').hasError('required')">Password is required.</div>
                    <div *ngIf="resetPasswordForm.get('newPassword').hasError('minlength')">Password must be at least 8 characters long.</div>
                  </div>
                </div>
              </div>
            </div>
            <div class="form-group mt-3">
              <button type="submit" class="button button-registerForm btn_4 boxed-btn">Reset Password</button>
            </div>
          </form>
          <p>Remembered your password? <a [routerLink]="['/login']">Login here</a></p>
        </div>
      </div>
    </div>
  </section>
  <!-- ================ register section end ================= -->
